<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIHUBX AI Cost Optimizer</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #111827;
        }

        header {
            background: #111827;
            color: white;
            padding: 30px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 30px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .card, .box {
            background: white;
            padding: 25px;
            margin-top: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(0,0,0,.08);
        }

        select, button {
            padding: 12px 18px;
            margin-top: 20px;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            background: #111827;
            color: white;
            border: none;
            cursor: pointer;
        }

        .success { color: green; }
        .error { color: red; }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }
    </style>
</head>

<body>

<header>
    <h1>AIHUBX 🚀</h1>
    <p>AI Cost Optimizer</p>
</header>

<div class="container">

    <h2>AI Cost Dashboard</h2>

    <select id="model">
        <option value="GPT">GPT</option>
        <option value="Gemini">Gemini</option>
        <option value="Claude">Claude</option>
        <option value="Llama">Llama</option>
    </select>

    <br>

    <button id="analyzeButton" onclick="analyzeUsage()">
        Analyze AI Usage
    </button>

    <p id="status"></p>

    <div class="cards">

        <div class="card">
            <h3>Total AI Cost</h3>
            <h2 id="totalCost">₹0</h2>
        </div>

        <div class="card">
            <h3>Estimated Saving</h3>
            <h2 id="saving">₹0</h2>
        </div>

        <div class="card">
            <h3>API Calls</h3>
            <h2 id="apiCalls">0</h2>
        </div>

        <div class="card">
            <h3>Tokens</h3>
            <h2 id="tokens">0</h2>
        </div>

    </div>

    <div class="box">
        <h2>🤖 Recommendation</h2>

        <p>
            Recommended Model:
            <strong id="recommendedModel">-</strong>
        </p>

        <p>
            Current Cost:
            ₹<strong id="currentCost">0</strong>
        </p>

        <p>
            Recommended Cost:
            ₹<strong id="recommendedCost">0</strong>
        </p>

        <p>
            Potential Saving:
            ₹<strong id="potentialSaving">0</strong>
        </p>
    </div>

    <div class="box">
        <h2>Cost Overview</h2>
        <canvas id="costChart"></canvas>
    </div>

    <div class="box">
        <h2>Usage History</h2>

        <table>
            <thead>
                <tr>
                    <th>Model</th>
                    <th>API Calls</th>
                    <th>Tokens</th>
                    <th>Cost</th>
                    <th>Saving</th>
                </tr>
            </thead>

            <tbody id="historyBody"></tbody>
        </table>
    </div>

</div>

<script>

const API_URL = "https://aihubx.onrender.com";

const chart = new Chart(
    document.getElementById("costChart"),
    {
        type: "bar",

        data: {
            labels: ["Current Cost", "Saving"],

            datasets: [{
                label: "AIHUBX Cost Analysis",
                data: [0, 0]
            }]
        },

        options: {
            responsive: true,
            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    }
);


async function analyzeUsage() {

    const button =
        document.getElementById("analyzeButton");

    const status =
        document.getElementById("status");

    const model =
        document.getElementById("model").value;

    button.disabled = true;

    status.innerText = "⏳ Analyzing...";
    status.className = "";


    try {

        const response = await fetch(
            API_URL + "/usage",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    agent_name: "AIHUBX Demo",
                    model: model,
                    api_calls: 100,
                    tokens: 5000
                })
            }
        );


        if (!response.ok) {
            throw new Error(
                "Backend returned HTTP " +
                response.status
            );
        }


        const data = await response.json();


        if (data.error) {
            throw new Error(data.error);
        }


        document.getElementById("totalCost").innerText =
            "₹" + data.total_cost;

        document.getElementById("saving").innerText =
            "₹" + data.estimated_saving;

        document.getElementById("apiCalls").innerText =
            data.api_calls;

        document.getElementById("tokens").innerText =
            data.tokens;

        document.getElementById("recommendedModel").innerText =
            data.recommended_model;

        document.getElementById("currentCost").innerText =
            data.total_cost;

        document.getElementById("recommendedCost").innerText =
            data.recommended_cost;

        document.getElementById("potentialSaving").innerText =
            data.estimated_saving;


        chart.data.datasets[0].data = [
            data.total_cost,
            data.estimated_saving
        ];

        chart.update();


        status.innerText =
            "✅ AI Usage Analyzed Successfully";

        status.className = "success";


        loadHistory();

    } catch (error) {

        console.error(error);

        status.innerText =
            "❌ Backend connection failed";

        status.className = "error";

    } finally {

        button.disabled = false;

    }
}


async function loadHistory() {

    try {

        const response = await fetch(
            API_URL + "/usage/history"
        );

        if (!response.ok) {
            throw new Error("History request failed");
        }

        const data = await response.json();

        const body =
            document.getElementById("historyBody");

        body.innerHTML = "";

        data.history.forEach(function(item) {

            const row =
                document.createElement("tr");

            row.innerHTML = `
                <td>${item.model}</td>
                <td>${item.api_calls}</td>
                <td>${item.tokens}</td>
                <td>₹${item.cost}</td>
                <td>₹${item.saving}</td>
            `;

            body.appendChild(row);

        });

    } catch (error) {

        console.error(
            "History error:",
            error
        );

    }
}


window.onload = loadHistory;

</script>

</body>
</html>
